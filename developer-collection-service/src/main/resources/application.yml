server:
  port: 8081

spring:
  application:
    name: developer-collection-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DEVELOPER_DATASOURCE_URL:jdbc:postgresql://postgres-developer:5432/developer_db}
    username: ${DEVELOPER_DATASOURCE_USERNAME:user}
    password: ${DEVELOPER_DATASOURCE_PASSWORD:pass}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

services:
  resource-catalog:
    url: http://${RESOURCE_CATALOG_SERVICE_URL:resource-catalog-service:8083}