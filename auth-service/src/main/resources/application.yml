server:
  port: 8082

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${AUTH_DATASOURCE_URL}
    username: ${AUTH_DATASOURCE_USERNAME}
    password: ${AUTH_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

springdoc:
  openapi:
    servers:
      - url: ${API_GATEWAY_URL:http://localhost:8080}
        description: "API Gateway"

services:
  developer-collection:
    # Aggiunto protocollo e default per garantire un URL valido all'avvio
    url: http://${DEVELOPER_COLLECTION_SERVICE_URL:localhost:8081}