server:
  port: 8082

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${AUTH_DATASOURCE_URL:jdbc:postgresql://postgres-auth:5432/auth_db}
    username: ${AUTH_DATASOURCE_USERNAME:user}
    password: ${AUTH_DATASOURCE_PASSWORD:pass}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

services:
  developer-collection:
    url: http://${DEVELOPER_COLLECTION_SERVICE_URL:developer-collection-service:8081}