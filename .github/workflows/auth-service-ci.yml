name: Auth Service CI

on:
  push:
    branches: [ "develop", "main" ]
    paths:
      - 'auth-service/**'
  pull_request:
    branches: [ "develop", "main" ]
    paths:
      - 'auth-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests with Maven
        run: |
          cd auth-service
          mvn clean test -DDEVELOPER_COLLECTION_SERVICE_URL=http://localhost