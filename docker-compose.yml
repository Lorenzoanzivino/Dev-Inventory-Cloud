services:
  # --- DATABASES ---
  auth-db:
    image: postgres:17-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - auth-data:/var/lib/postgresql/data
    networks:
      - backend-net

  developer-db:
    image: postgres:17-alpine
    container_name: developer-db
    environment:
      POSTGRES_DB: developer_collection_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d developer_collection_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - developer-data:/var/lib/postgresql/data
    networks:
      - backend-net

  resource-db:
    image: postgres:17-alpine
    container_name: resource-db
    environment:
      POSTGRES_DB: resource_catalog_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d resource_catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - resource-data:/var/lib/postgresql/data
    networks:
      - backend-net

  # --- MICROSERVICES ---
  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AUTH_DATASOURCE_URL=jdbc:postgresql://auth-db:5432/auth_db
      - AUTH_DATASOURCE_USERNAME=${DB_USERNAME}
      - AUTH_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - API_GATEWAY_URL=${API_GATEWAY_URL}
      - DEVELOPER_COLLECTION_SERVICE_URL=developer-collection-service:8081
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - backend-net

  developer-collection-service:
    build: ./developer-collection-service
    container_name: developer-collection-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DEVELOPER_DATASOURCE_URL=jdbc:postgresql://developer-db:5432/developer_collection_db
      - DEVELOPER_DATASOURCE_USERNAME=${DB_USERNAME}
      - DEVELOPER_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL}
      - RESOURCE_CATALOG_SERVICE_URL=resource-catalog-service:8083
      - API_GATEWAY_URL=${API_GATEWAY_URL}
    depends_on:
      developer-db:
        condition: service_healthy
    networks:
      - backend-net

  resource-catalog-service:
    build: ./resource-catalog-service
    container_name: resource-catalog-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - RESOURCE_DATASOURCE_URL=jdbc:postgresql://resource-db:5432/resource_catalog_db
      - RESOURCE_DATASOURCE_USERNAME=${DB_USERNAME}
      - RESOURCE_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL}
      - API_GATEWAY_URL=${API_GATEWAY_URL}
    depends_on:
      resource-db:
        condition: service_healthy
    networks:
      - backend-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "80:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:8082
      - DEVELOPER_COLLECTION_SERVICE_URL=http://developer-collection-service:8081
      - RESOURCE_CATALOG_SERVICE_URL=http://resource-catalog-service:8083
    depends_on:
      - auth-service
      - developer-collection-service
      - resource-catalog-service
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

volumes:
  auth-data:
  developer-data:
  resource-data: