services:
  db:
    image: postgres:17-alpine
    container_name: catalog-db
    environment:
      POSTGRES_DB: resource_catalog_db
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resource_catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  resource-service:
    build: ./resource-catalog-service
    container_name: resource-catalog-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://catalog-db:5432/resource_catalog_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy